# Engine B overlay: Cube Core semantic layer (127.0.0.1:4000). Use with the base file:
#   docker compose -f infrastructure/compose/docker-compose.yml -f infrastructure/compose/analytics.yml up -d cube --wait
# `name: nearesis` joins the base project network so ClickHouse resolves as `clickhouse:8123`.
name: nearesis
services:
  cube:
    image: cubejs/cube:v1.8.18@sha256:d382326a0d2786242c3992f3dd462efbea82d07b2823ecdc83d619d2d6f5dcb7
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      CUBEJS_DEV_MODE: "false"
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: "8123"
      CUBEJS_DB_NAME: ${NEARESIS_CUBE_DB:-nearesis}
      CUBEJS_DB_USER: nearesis
      CUBEJS_DB_PASS: nearesis
      # Dev API secret: never shipped to a browser; the gateway signs per-request security contexts server-side.
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-nearesis-dev-cube-secret-not-for-production}
      CUBEJS_PRE_AGGREGATIONS_SCHEMA: nearesis_preagg
      CUBEJS_REFRESH_WORKER: "true"
      CUBEJS_SCHEDULED_REFRESH_DEFAULT: "true"
      # Single-node Cube Core: in-memory queue/cache, rollups materialize in ClickHouse (schema nearesis_preagg), no Cube Store.
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
      CUBEJS_LOG_LEVEL: warn
      CUBEJS_TELEMETRY: "false"
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ../../services/analytics/cube/model:/cube/conf/model:ro
      - ../../services/analytics/cube/cube.js:/cube/conf/cube.js:ro
    healthcheck:
      {
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/readyz || exit 1"],
        interval: 4s,
        timeout: 4s,
        retries: 40,
      }
    mem_limit: 1536m
