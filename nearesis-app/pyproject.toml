[project]
name = "nearesis-py"
version = "0.1.0"
description = "Nearesis Python components: offline replay and quantitative methods"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==2.0.0",
  "pyarrow==26.0.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.uv]
package = false
