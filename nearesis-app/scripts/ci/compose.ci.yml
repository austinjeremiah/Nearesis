# Always applied by scripts/ci/steps.sh (CI and local replay). The cubejs/cube image ships neither wget nor curl, so the
# healthcheck in infrastructure/compose/analytics.yml can never pass and `up --wait` fails; probe /readyz with node.
# Tracked upstream in coordination/INTEGRATION_QUEUE.md; delete this file once analytics.yml is fixed.
services:
  cube:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 4s
      timeout: 4s
      retries: 40
