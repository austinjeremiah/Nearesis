# Local-validation override ONLY (never passed by .github/workflows/ci.yml): moves every published host port of the
# compose stack away from the developer stack (55432, 56379, 58123, 59000, 57233, 58233, 4000) so a second project,
# `-p nearesis-ci`, can run beside it. Services still listen on their default ports inside the compose network.
services:
  postgres:
    ports: !override ["127.0.0.1:65432:5432"]
  redis:
    ports: !override ["127.0.0.1:65379:6379"]
  clickhouse:
    ports: !override ["127.0.0.1:65123:8123", "127.0.0.1:65000:9000"]
  temporal:
    ports: !override ["127.0.0.1:65233:7233", "127.0.0.1:65234:8233"]
  cube:
    ports: !override ["127.0.0.1:65400:4000"]
