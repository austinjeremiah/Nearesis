[package]
name = "nearesis-verifier"
version = "0.1.0"
edition = "2021"
description = "Nearesis deterministic research-metric verifier for OutLayer (wasm32-wasip2)"
license = "UNLICENSED"
publish = false

# OutLayer requires a binary crate: stdin JSON in, stdout JSON out.
[[bin]]
name = "nearesis-verifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
primitive-types = { version = "0.13", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
