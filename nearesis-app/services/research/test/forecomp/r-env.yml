# Pinned R environment for the ForeComp cross-check (services/research/test/forecomp).
# Create:  micromamba create -y -p nearesis-app/.toolchain/r-env -f services/research/test/forecomp/r-env.yml
#          sh services/research/test/forecomp/install-forecomp.sh
# Exact resolved set used for the recorded verification: r-env.lock.txt (141 packages, name=version=build).
# The cross-check test skips with an explicit NOT_RUN reason when Rscript, ForeComp 1.0.0 or jsonlite is missing.
name: nearesis-r
channels:
  - conda-forge
dependencies:
  - r-base=4.5.3
  - r-jsonlite=2.0.0
  - r-forecast=9.0.2
  - r-astsa=2.5
  - r-ggplot2=4.0.3
  - r-rlang=1.3.0
  - r-remotes=2.5.0
# CRAN package (not on conda-forge), installed by install-forecomp.sh:
#   ForeComp 1.0.0  (CRAN, packaged 2026-02-20, GPL >= 3, authors N. Schor and M. Shin)
